<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open a browser project or game.">
  <title>Web Projects</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 0, #dce7ff 0, transparent 38rem),
        radial-gradient(ellipse at 92% 20%, #dff7f2 0, transparent 28rem),
        #f4f6fb;
    }

    main {
      width: min(1000px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(2.5rem, 7vw, 5rem) 0;
    }

    h1 {
      margin: 0 0 2.5rem;
      font-size: clamp(2.3rem, 7vw, 4rem);
      letter-spacing: -.055em;
      line-height: 1;
    }

    section + section { margin-top: 2.5rem; }
    h2 { margin: 0 0 1rem; font-size: 1rem; color: #657187; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: .9rem;
    }

    .project {
      display: flex;
      position: relative;
      min-height: 120px;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.15rem 1.25rem;
      overflow: hidden;
      border: 1px solid #dfe5ef;
      border-radius: 18px;
      background: linear-gradient(145deg, #fff, #fbfcff);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px #1720330a;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .project::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(180deg, #526ff0, #21ad9a);
      content: "";
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .project:hover {
      transform: translateY(-3px);
      border-color: #b7c8e8;
      box-shadow: 0 16px 32px #17203316;
    }

    .project:hover::before { opacity: 1; }
    .project:focus-visible { outline: 3px solid #4e87df; outline-offset: 3px; }
    .project-name { font-size: 1.05rem; font-weight: 700; }
    .project-category {
      display: block;
      width: fit-content;
      margin-top: .55rem;
      padding: .2rem .55rem;
      border-radius: 999px;
      background: #eef2fa;
      color: #657187;
      font-size: .76rem;
    }
    .project-arrow {
      display: grid;
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #f1f4fb;
      color: #245caa;
      font-size: 1.2rem;
      transition: background 160ms ease, transform 160ms ease;
    }
    .project:hover .project-arrow { transform: translateX(2px); background: #e6edff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
      .project:hover, .project:hover .project-arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Projects</h1>

    <section aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <div class="project-grid">
        <a class="project" href="BDT-ExchangeHub/Currency%20Converte%20and%20Growth%20Rate/currency.html">
          <span><span class="project-name">Currency Converter</span><span class="project-category">Finance</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
        <a class="project" href="BDT-ExchangeHub/Precious%20Metal%20Price%20Convertion%20and%20Growth%20Rate/metal.html">
          <span><span class="project-name">Metal Price Hub</span><span class="project-category">Finance</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
        <a class="project" href="Bangla%20OCR%20Engine/Bangla_OCR_Engine.html">
          <span><span class="project-name">Bangla OCR</span><span class="project-category">Documents</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Games</h2>
      <div class="project-grid">
        <a class="project" href="Chess%20Games/ChessArena.html">
          <span><span class="project-name">Chess</span><span class="project-category">Two players</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
        <a class="project" href="Games/index.html#tic-tac-toe">
          <span><span class="project-name">Tic-Tac-Toe</span><span class="project-category">Two players</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
        <a class="project" href="Games/index.html#memory-match">
          <span><span class="project-name">Memory Match</span><span class="project-category">Solo</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
        <a class="project" href="Games/index.html#number-guess">
          <span><span class="project-name">Number Guess</span><span class="project-category">Solo</span></span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
